<!DOCTYPE html>
<html lang="en" data-bg="white">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Notepad — Write And Save In One Click</title>
<meta name="description" content="A Free, Ad-Free, No-Account Notepad. Write Instantly And Save With One Click. Jump Back Into Any Note, Anytime.">
<meta name="theme-color" content="#1E9C97">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notepad">
<style>
  :root{
    --teal:#1E9C97;
    --teal-dark:#137873;
    --ink:#20302E;
    --ink-soft:#5C6F6C;
    --card:#FFFFFF;
    --border:#DCE6E4;
    --danger:#C0564B;
  }
  html[data-bg="white"]{ --bg:#FFFFFF; --bg-alt:#F4F7F6; }
  html[data-bg="cream"]{ --bg:#FBF3E3; --bg-alt:#F5EAD3; }
  html[data-bg="blue"]{ --bg:#E8F4F8; --bg-alt:#DCECF2; }
  html[data-bg="green"]{ --bg:#E9F5EA; --bg-alt:#DCEFDE; }
  html[data-bg="rose"]{ --bg:#FDECEF; --bg-alt:#FADFE4; }
  html[data-bg="grey"]{ --bg:#EFEFEF; --bg-alt:#E4E4E4; }

  html[data-theme="dark"]{
    --ink:#EAF3F1;
    --ink-soft:#93A9A6;
    --card:#182322;
    --border:#2A3B39;
    --bg:#141C1B;
    --bg-alt:#1D2827;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  header.app-header{
    background:linear-gradient(120deg,var(--teal),var(--teal-dark));
    color:#fff;
    padding:14px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{ margin:0; font-size:1.4rem; }
  .brand span{ font-size:.78rem; opacity:.9; }
  .clock-box{ text-align:right; line-height:1.25; }
  .clock-box .time{ font-size:1.3rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .clock-box .date{ font-size:.85rem; opacity:.9; }

  .bg-picker{ display:flex; gap:6px; align-items:center; }
  .swatch{
    width:22px; height:22px; border-radius:50%;
    border:2px solid rgba(255,255,255,.7);
    cursor:pointer;
    padding:0;
  }
  .swatch[data-c="white"]{ background:#FFFFFF; }
  .swatch[data-c="cream"]{ background:#FBF3E3; }
  .swatch[data-c="blue"]{ background:#E8F4F8; }
  .swatch[data-c="green"]{ background:#E9F5EA; }
  .swatch[data-c="rose"]{ background:#FDECEF; }
  .swatch[data-c="grey"]{ background:#EFEFEF; }
  .swatch.active{ border-color:#fff; box-shadow:0 0 0 2px var(--teal-dark); }

  .theme-toggle{
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.15);
    cursor:pointer;
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    margin-left:4px;
  }
  .theme-toggle:hover{ background:rgba(255,255,255,.28); }

  #floatBtn{ background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.7); }
  #floatBtn:hover{ background:rgba(255,255,255,.28); }
  .float-note{ text-align:center; font-size:.78rem; color:var(--ink-soft); padding:6px 16px 0; }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:18px 16px 60px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
  }

  .new-note-btn{
    padding:14px 22px;
    font-size:1.05rem;
    font-weight:700;
    border:none;
    border-radius:12px;
    background:var(--teal);
    color:#fff;
    cursor:pointer;
    margin-bottom:12px;
  }
  .new-note-btn:hover{ background:var(--teal-dark); }

  .notes-heading{ margin:0 0 12px; font-size:1.05rem; }

  .notes-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .note-tile{
    display:flex;
    flex-direction:column;
    height:160px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .note-tile.active{ border-color:var(--teal); box-shadow:0 0 0 2px rgba(30,156,151,.25); }
  .note-tile .tile-text{
    flex:1;
    font-size:.84rem;
    line-height:1.35;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:6;
    -webkit-box-orient:vertical;
  }
  .note-tile .tile-text.empty{ color:var(--ink-soft); font-style:italic; }
  .note-tile .tile-stamp{ font-size:.68rem; color:var(--ink-soft); margin-top:6px; }
  .note-tile .del-btn{
    position:absolute; top:6px; right:6px;
    background:rgba(255,255,255,.75); border:none; cursor:pointer; font-size:.9rem;
    color:var(--ink-soft); padding:3px 5px; border-radius:6px; line-height:1;
  }
  .note-tile .del-btn:hover{ color:var(--danger); background:rgba(192,86,75,.18); }
  html[data-theme="dark"] .note-tile .del-btn{ background:rgba(0,0,0,.35); color:#C7D6D3; }

  @media (max-width:600px){
    .notes-grid{ grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
    .note-tile{ height:100px; padding:7px; border-radius:9px; }
    .note-tile .tile-text{ font-size:.7rem; line-height:1.25; -webkit-line-clamp:4; }
    .note-tile .tile-stamp{ font-size:.6rem; margin-top:3px; }
    .note-tile .del-btn{ font-size:.75rem; padding:2px 4px; top:4px; right:4px; }
  }
  .empty-hint{ color:var(--ink-soft); font-size:.9rem; padding:8px 4px; }

  .editor-toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  .tool-btn{
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg-alt);
    color:var(--ink);
    font-weight:600;
    font-size:.88rem;
    cursor:pointer;
  }
  .tool-btn:hover{ background:var(--border); }
  .tool-btn.primary{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .tool-btn.primary:hover{ background:var(--teal-dark); }
  .save-flag{ font-size:.8rem; color:var(--teal-dark); opacity:0; transition:opacity .4s ease; margin-left:auto; }
  .save-flag.show{ opacity:1; }

  textarea#editor{
    width:100%;
    min-height:40vh;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    font-size:1rem;
    line-height:1.5;
    font-family:inherit;
    color:var(--ink);
    background:var(--bg-alt);
  }
  textarea#editor:focus{ outline:2px solid var(--teal); outline-offset:1px; }

  .editor-empty{
    color:var(--ink-soft);
    padding:6px 4px 0;
  }

  footer{ text-align:center; color:var(--ink-soft); font-size:.8rem; padding:20px; }

  #printArea{ display:none; }
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{
      display:block !important;
      white-space:pre-wrap;
      word-wrap:break-word;
      font-family:Georgia,"Times New Roman",serif;
      font-size:13pt;
      line-height:1.6;
      color:#000;
      padding:0;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <h1>📝 Free Notepad</h1>
    <span>100% Free, Forever — No Accounts, No Paywall.</span>
  </div>
  <div class="bg-picker" id="bgPicker" aria-label="Background Colour">
    <button class="swatch" data-c="white" title="White"></button>
    <button class="swatch" data-c="cream" title="Cream"></button>
    <button class="swatch" data-c="blue" title="Blue"></button>
    <button class="swatch" data-c="green" title="Green"></button>
    <button class="swatch" data-c="rose" title="Rose"></button>
    <button class="swatch" data-c="grey" title="Grey"></button>
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌙</button>
  </div>
  <div class="clock-box">
    <div class="time" id="clockTime">--:--:-- --</div>
    <div class="date" id="clockDate">--/--/----</div>
  </div>
  <button class="tool-btn" id="floatBtn" title="Keep Free Notepad Floating On Top Of Every Window">📌 Float On Desktop</button>
</header>
<div class="float-note" id="floatNote"></div>

<main id="mainApp">
  <section class="panel" id="composerPanel">
    <button class="new-note-btn" id="newNoteBtn">＋ New Note</button>
    <div id="editorArea">
      <div class="editor-empty" id="editorEmpty">Click "＋ New Note" To Start Writing — Or Pick A Note Below To Open And Edit It.</div>
    </div>
  </section>

  <section class="panel">
    <h2 class="notes-heading">Your Notes</h2>
    <div class="notes-grid" id="notesList"></div>
  </section>
</main>

<footer>Free Notepad — Your Notes Stay Only On This Device (No Login, No Server, No Tracking).</footer>

<div id="printArea"></div>

<script>
(function(){
  const STORE_KEY = 'freeNotepadNotes';
  const BG_KEY = 'freeNotepadBg';
  const THEME_KEY = 'freeNotepadTheme';

  const notesList = document.getElementById('notesList');
  const editorArea = document.getElementById('editorArea');
  const newNoteBtn = document.getElementById('newNoteBtn');
  const bgPicker = document.getElementById('bgPicker');
  const themeToggle = document.getElementById('themeToggle');

  let notes = loadNotes();
  let activeId = null;
  let saveTimer = null;

  function loadNotes(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function persistNotes(){
    localStorage.setItem(STORE_KEY, JSON.stringify(notes));
  }
  function titleFor(note){
    const firstLine = (note.content || '').split('\n').find(l => l.trim().length > 0);
    if(!firstLine) return 'Untitled Note';
    return firstLine.trim().slice(0, 40);
  }
  function stampFor(note){
    const d = new Date(note.updated);
    return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  }

  function renderList(){
    notesList.innerHTML = '';
    if(notes.length === 0){
      const p = document.createElement('div');
      p.className = 'empty-hint';
      p.textContent = 'No Notes Yet.';
      notesList.appendChild(p);
      return;
    }
    const sorted = [...notes].sort((a,b) => b.updated - a.updated);
    sorted.forEach(note => {
      const tile = document.createElement('div');
      tile.className = 'note-tile' + (note.id === activeId ? ' active' : '');
      tile.addEventListener('click', (e) => {
        if(e.target.closest('.del-btn')) return;
        openNote(note.id);
      });

      const text = document.createElement('div');
      const hasContent = (note.content || '').trim().length > 0;
      text.className = 'tile-text' + (hasContent ? '' : ' empty');
      text.textContent = hasContent ? note.content : 'Empty Note';

      const stamp = document.createElement('div');
      stamp.className = 'tile-stamp';
      stamp.textContent = stampFor(note);

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.title = 'Delete Note';
      del.textContent = '🗑';
      del.addEventListener('click', () => deleteNote(note.id));

      tile.appendChild(del);
      tile.appendChild(text);
      tile.appendChild(stamp);
      notesList.appendChild(tile);
    });
  }

  function renderEditor(){
    if(activeId === null){
      editorArea.innerHTML = '<div class="editor-empty" id="editorEmpty">Click "＋ New Note" To Start Writing — Or Pick A Note Below To Open And Edit It.</div>';
      return;
    }
    const note = notes.find(n => n.id === activeId);
    if(!note){ activeId = null; renderEditor(); return; }

    editorArea.innerHTML = `
      <div class="editor-toolbar">
        <button class="tool-btn primary" id="saveBtn">💾 Save</button>
        <button class="tool-btn" id="pdfBtn">📄 Save As PDF</button>
        <button class="tool-btn" id="closeBtn">✕ Close</button>
        <span class="save-flag" id="saveFlag">Saved</span>
      </div>
      <textarea id="editor" placeholder="Start Typing…" autofocus>${escapeHtml(note.content)}</textarea>
    `;
    const editor = document.getElementById('editor');
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);

    function saveNow(){
      note.content = editor.value;
      note.updated = Date.now();
      persistNotes();
      renderList();
      flashSaved();
    }

    editor.addEventListener('input', () => {
      note.content = editor.value;
      note.updated = Date.now();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 250);
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      clearTimeout(saveTimer);
      saveNow();
    });

    document.getElementById('pdfBtn').addEventListener('click', () => {
      clearTimeout(saveTimer);
      saveNow();
      const printArea = document.getElementById('printArea');
      printArea.textContent = editor.value;
      const safeTitle = titleFor(note).replace(/[\\/:*?"<>|]/g, '').trim() || 'Note';
      const prevTitle = document.title;
      document.title = safeTitle;
      window.addEventListener('afterprint', () => { document.title = prevTitle; }, { once:true });
      window.print();
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      clearTimeout(saveTimer);
      saveNow();
      activeId = null;
      renderList();
      renderEditor();
    });
  }

  function flashSaved(){
    const flag = document.getElementById('saveFlag');
    if(!flag) return;
    flag.classList.add('show');
    setTimeout(() => flag.classList.remove('show'), 900);
  }
  function escapeHtml(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function openNote(id){
    activeId = id;
    renderList();
    renderEditor();
  }
  function deleteNote(id){
    if(!confirm('Delete This Note? This Can\'t Be Undone.')) return;
    notes = notes.filter(n => n.id !== id);
    persistNotes();
    if(activeId === id) activeId = null;
    renderList();
    renderEditor();
  }
  function createNote(){
    const note = { id: 'n' + Date.now() + Math.random().toString(36).slice(2,7), content: '', updated: Date.now() };
    notes.push(note);
    persistNotes();
    activeId = note.id;
    renderList();
    renderEditor();
  }

  newNoteBtn.addEventListener('click', createNote);

  // Background colour picker
  function applyBg(c){
    document.documentElement.setAttribute('data-bg', c);
    localStorage.setItem(BG_KEY, c);
    [...bgPicker.querySelectorAll('.swatch')].forEach(s => s.classList.toggle('active', s.dataset.c === c));
  }
  bgPicker.addEventListener('click', (e) => {
    const sw = e.target.closest('.swatch');
    if(!sw) return;
    applyBg(sw.dataset.c);
  });
  applyBg(localStorage.getItem(BG_KEY) || 'white');

  // Dark mode toggle
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(THEME_KEY, t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    themeToggle.title = t === 'dark' ? 'Switch To Light Mode' : 'Switch To Dark Mode';
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');

  // Clock: 12hr digital + d/m/y date
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    document.getElementById('clockTime').textContent =
      `${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;
    document.getElementById('clockDate').textContent =
      `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  }
  tick();
  setInterval(tick, 1000);

  renderList();
  renderEditor();

  // Floating always-on-top window (Document Picture-in-Picture)
  const floatBtn = document.getElementById('floatBtn');
  const floatNote = document.getElementById('floatNote');
  const mainApp = document.getElementById('mainApp');
  let pipWindow = null;
  let placeholder = null;

  if(!('documentPictureInPicture' in window)){
    floatBtn.style.display = 'none';
    floatNote.textContent = 'Floating On Top Of Every Window Needs Chrome Or Edge On A Computer.';
  }

  floatBtn.addEventListener('click', async () => {
    if(pipWindow) return;
    try{
      pipWindow = await documentPictureInPicture.requestWindow({ width: 300, height: 700 });
    }catch(e){
      floatNote.textContent = "Couldn't Open The Floating Window: " + e.message;
      return;
    }

    [...document.styleSheets].forEach(sheet => {
      try{
        const cssRules = [...sheet.cssRules].map(r => r.cssText).join('\n');
        const style = document.createElement('style');
        style.textContent = cssRules;
        pipWindow.document.head.appendChild(style);
      }catch(e){
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = sheet.href;
        pipWindow.document.head.appendChild(link);
      }
    });
    pipWindow.document.documentElement.setAttribute('data-bg', document.documentElement.getAttribute('data-bg'));
    pipWindow.document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme'));
    pipWindow.document.title = 'Free Notepad';

    placeholder = document.createElement('div');
    placeholder.className = 'panel';
    placeholder.style.textAlign = 'center';
    placeholder.style.color = 'var(--ink-soft)';
    placeholder.textContent = 'Floating On Your Desktop Right Now — Close That Window To Bring It Back Here.';
    mainApp.replaceWith(placeholder);
    pipWindow.document.body.style.margin = '0';
    pipWindow.document.body.appendChild(mainApp);
    floatBtn.textContent = '📌 Floating…';

    pipWindow.addEventListener('pagehide', () => {
      placeholder.replaceWith(mainApp);
      pipWindow = null;
      floatBtn.textContent = '📌 Float On Desktop';
    }, { once:true });
  });
})();
</script>

</body>
</html>
